---
# Ansible playbook to set up database server
- name: Configure Database Server
  hosts: database
  become: yes
  vars:
    # Server configuration
    server_ip: "88.99.86.51"  # From Terraform output
    
    # GCP Registry
    registry_host: "europe-west3-docker.pkg.dev"
    registry_project: "predkit"
    registry_repo: "main"
    
    compose_dir: "/opt/predkit"
    
    # API domain
    api_domain: "api.predkit.com"
    
    # Database configuration
    postgres_db: "predkit"
    postgres_user: "pikachu"
    
    # WireGuard VPN configuration
    wireguard_port: 51820
    wireguard_network: "10.0.100.0/24"
    wireguard_server_vpn_ip: "10.0.100.1"
    wireguard_server_ip: "{{ server_ip }}"
    wireguard_clients:
      - name: "local-dev"
        vpn_ip: "10.0.100.2"
        persistent_keepalive: true
      - name: "admin-laptop"
        vpn_ip: "10.0.100.3"
        persistent_keepalive: true
      - name: "ci-cd"
        vpn_ip: "10.0.100.4"
        persistent_keepalive: true
      - name: "api"
        vpn_ip: "10.0.100.11"
        persistent_keepalive: true
  vars_files:
    - vars/secrets.yml
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker, Nginx, and Certbot
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Google Cloud SDK
      shell: |
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
        curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
        apt-get update
        apt-get install -y google-cloud-cli
      args:
        creates: /usr/bin/gcloud

    - name: Copy GCP service account key
      copy:
        src: ../terraform/service-key.json
        dest: /root/service-key.json
        mode: '0600'

    - name: Authenticate with GCP service account
      shell: gcloud auth activate-service-account --key-file=/root/service-key.json

    - name: Configure Docker for GCP registry
      shell: yes | gcloud auth configure-docker {{ registry_host }}
      register: docker_auth_result

    - name: Show Docker auth result
      debug:
        var: docker_auth_result

    - name: Create compose directory
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: '0755'

    - name: Create init-scripts directory
      file:
        path: "{{ compose_dir }}/init-scripts"
        state: directory
        mode: '0755'

    - name: Create backups directory
      file:
        path: "{{ compose_dir }}/backups"
        state: directory
        mode: '0755'

    - name: Create environment file
      template:
        src: env.j2
        dest: "{{ compose_dir }}/.env"
        mode: '0600'

    - name: Create docker-compose file
      template:
        src: compose.yml.j2
        dest: "{{ compose_dir }}/compose.yml"
        mode: '0644'
      notify: restart predkit services

    - name: Check for new Docker images and start/update stack
      shell: |
        cd {{ compose_dir }}
        docker compose pull --quiet
        docker compose up -d
      register: compose_up_result
      changed_when: "'Pulled' in compose_up_result.stderr or 'Started' in compose_up_result.stderr or 'Recreated' in compose_up_result.stderr"

    - name: Wait for database to be ready
      shell: |
        docker compose -f {{ compose_dir }}/compose.yml exec -T postgres pg_isready -U {{ postgres_user }}
      register: pg_ready
      retries: 30
      delay: 2
      until: pg_ready.rc == 0

    - name: Install required PostgreSQL extensions
      shell: |
        docker compose -f {{ compose_dir }}/compose.yml exec -T postgres psql -U {{ postgres_user }} -d {{ postgres_db }} << 'EOF'
        -- Enable required extensions for PredKit
        
        -- Create pg_search extension (ParadeDB - for BM25)
        DO $$
        BEGIN
            IF EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'pg_search') THEN
                CREATE EXTENSION IF NOT EXISTS pg_search;
                RAISE NOTICE 'pg_search extension created';
            ELSE
                RAISE WARNING 'pg_search extension not available';
            END IF;
        END $$;
        
        -- Create ai extension (pgai, will CASCADE install vector)
        DO $$
        BEGIN
            IF EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'ai') THEN
                CREATE EXTENSION IF NOT EXISTS ai CASCADE;
                RAISE NOTICE 'ai extension created';
            ELSE
                RAISE WARNING 'ai extension not available';
            END IF;
        END $$;
        
        -- Verify extensions
        SELECT extname, extversion FROM pg_extension 
        WHERE extname IN ('pg_search', 'ai') 
        ORDER BY extname;
        EOF
      register: extensions_result
      changed_when: "'CREATE EXTENSION' in extensions_result.stdout"

    - name: Install pgai in database (creates ai schema and functions)
      shell: |
        docker run --rm --network predkit_predkit-network python:3.12-slim \
          bash -c "pip install -q pgai && python -c \"import urllib.parse; import pgai; pgai.install('postgresql://{{ postgres_user }}:' + urllib.parse.quote('{{ postgres_password }}') + '@postgres:5432/{{ postgres_db }}')\""
      register: pgai_install
      changed_when: "'already installed' not in pgai_install.stdout"
      failed_when: false

    - name: Create systemd service for predkit stack
      template:
        src: predkit-stack.service.j2
        dest: /etc/systemd/system/predkit-stack.service
      notify: restart predkit services

    - name: Enable predkit stack
      systemd:
        name: predkit-stack
        enabled: yes
        daemon_reload: yes

    # Create systemd service for indexer
    - name: Create systemd service for indexer
      template:
        src: indexer.service.j2
        dest: /etc/systemd/system/indexer.service

    # Create systemd timer for indexer
    - name: Create systemd timer for indexer
      template:
        src: indexer.timer.j2
        dest: /etc/systemd/system/indexer.timer

    # Enable and start indexer timer
    - name: Enable indexer timer
      systemd:
        name: indexer.timer
        enabled: yes
        daemon_reload: yes
        state: started

    # Nginx Setup
    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Create certbot webroot directory
      file:
        path: /var/www/certbot
        state: directory
        mode: '0755'

    # SSL Certificate Setup (before creating nginx config)
    - name: Check if SSL certificate exists
      stat:
        path: "/etc/letsencrypt/live/{{ api_domain }}/fullchain.pem"
      register: ssl_cert

    - name: Create temporary HTTP-only nginx config (for initial certbot run)
      copy:
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ api_domain }};

              location /.well-known/acme-challenge/ {
                  root /var/www/certbot;
              }

              location / {
                  return 503 "Service temporarily unavailable during SSL setup";
              }
          }
        dest: /etc/nginx/sites-available/predkit-api-temp
        mode: '0644'
      when: not ssl_cert.stat.exists

    - name: Enable temporary nginx site
      file:
        src: /etc/nginx/sites-available/predkit-api-temp
        dest: /etc/nginx/sites-enabled/predkit-api
        state: link
        force: yes
      when: not ssl_cert.stat.exists

    - name: Test temporary nginx configuration
      command: nginx -t
      when: not ssl_cert.stat.exists
      changed_when: false

    - name: Start nginx for certbot (if not running)
      systemd:
        name: nginx
        state: restarted
      when: not ssl_cert.stat.exists

    - name: Obtain SSL certificate with certbot
      command: >
        certbot certonly --webroot 
        -w /var/www/certbot
        -d {{ api_domain }}
        --non-interactive
        --agree-tos
        --email {{ letsencrypt_email }}
      when: 
        - not ssl_cert.stat.exists
        - api_domain != ansible_default_ipv4.address
      register: certbot_result
      ignore_errors: yes

    - name: Create full nginx site configuration for API (with HTTPS)
      template:
        src: nginx-api.conf.j2
        dest: /etc/nginx/sites-available/predkit-api
        mode: '0644'
      notify: reload nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/predkit-api
        dest: /etc/nginx/sites-enabled/predkit-api
        state: link
        force: yes
      notify: reload nginx

    - name: Remove temporary nginx config (if exists)
      file:
        path: /etc/nginx/sites-available/predkit-api-temp
        state: absent

    - name: Test nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: nginx_test.rc != 0

    - name: Ensure nginx is started and enabled
      systemd:
        name: nginx
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Display certbot result
      debug:
        var: certbot_result
      when: certbot_result is defined

    - name: Setup certbot auto-renewal with systemd timer
      systemd:
        name: certbot.timer
        enabled: yes
        state: started

    - name: Ensure certbot renewal hook reloads nginx
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: |
          #!/bin/bash
          systemctl reload nginx
        mode: '0755'

    - name: Test certbot renewal (dry-run)
      command: certbot renew --dry-run
      register: certbot_dryrun
      changed_when: false
      failed_when: false
      when: ssl_cert.stat.exists

    # WireGuard VPN Setup
    - name: Setup WireGuard VPN
      import_role:
        name: wireguard

  handlers:
    - name: restart predkit services
      systemd:
        name: predkit-stack
        state: restarted
        daemon_reload: yes

    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
