[project]
name = "predkit-backend"
version = "0.1.0"
description = "PredKit serverless backend with GCP Cloud Functions"
authors = [
    {name = "Dali Chelbi", email = "dali@predkit.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "functions-framework>=3.5.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.16.5",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.0.287",
]

[project.scripts]
test = "pytest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/api", "src/indexers"]

[tool.basedpyright]
extraPaths = ["src"]
typeCheckingMode = "strict"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

